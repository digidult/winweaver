[package]
name = "winweaver"
description = "WinWeaver: the window and the MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "winweaver"
path = "src/main.rs"

[features]
default = ["glow", "wgpu"]
# The renderers of the window: OpenGL (glow), DirectX 12 (wgpu); at least one.
glow = ["winweaver-ui/glow"]
wgpu = ["winweaver-ui/wgpu"]

[dependencies]
winweaver-core = { path = "../winweaver-core" }
winweaver-ui = { path = "../winweaver-ui", default-features = false, features = ["full"] }
winweaver-mcp = { path = "../winweaver-mcp" }
winweaver-win = { path = "../winweaver-win" }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
