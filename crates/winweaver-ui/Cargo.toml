[package]
name = "winweaver-ui"
description = "WinWeaver window: tabs, toolbar, navigation, the profile tree and detail panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["glow", "wgpu"]
# The renderers of the window (src/renderer.rs): OpenGL through glow, DirectX 12 through wgpu with that
# backend only. At least one is needed; the settings and --renderer offer the ones built in.
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu_no_default_features", "dep:wgpu"]

[dependencies]
winweaver-core = { path = "../winweaver-core" }
winweaver-win = { path = "../winweaver-win" }
winweaver-mcp = { path = "../winweaver-mcp" }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links"] }
# The DirectX 12 backend of wgpu alone: no Vulkan, no OpenGL through wgpu (glow draws OpenGL).
wgpu = { version = "30", default-features = false, features = ["dx12"], optional = true }
egui_commonmark = "0.25"
rfd = "0.17"
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
