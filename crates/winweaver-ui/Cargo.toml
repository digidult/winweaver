[package]
name = "winweaver-ui"
description = "WinWeaver window: tabs, toolbar, navigation, the profile tree and detail panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
winweaver-core = { path = "../winweaver-core" }
winweaver-win = { path = "../winweaver-win" }
winweaver-mcp = { path = "../winweaver-mcp" }
# OpenGL through egui_glow instead of the default wgpu; the tests keep wgpu (egui_kittest below).
eframe = { version = "0.36", default-features = false, features = ["glow", "accesskit", "default_fonts", "links"] }
egui_commonmark = "0.25"
rfd = "0.17"
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
