<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wwlite</title>
  <!-- The page of the browser edition of wwlite: the canvas the window draws in, a text while
       the module loads, and the glue wasm-bindgen writes (wwlite.js, wwlite_bg.wasm) next to
       this file. Serve the folder over http; a page opened from file:// cannot load the module. -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f3f4f6; }
    canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
    #loading_text { position: absolute; top: 40%; width: 100%; text-align: center; font-family: system-ui, sans-serif; color: #444; }
  </style>
</head>
<body>
  <canvas id="wwlite"></canvas>
  <p id="loading_text">wwlite is loading...</p>
  <script type="module">
    import init from "./wwlite.js";
    init().catch((e) => {
      const p = document.getElementById("loading_text");
      if (p) { p.textContent = "wwlite did not start: " + e; }
      console.error(e);
    });
  </script>
</body>
</html>
