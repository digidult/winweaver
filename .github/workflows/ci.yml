name: CI

# CI does not run at every push (AGENTS.md, section 5): a draft pull request runs nothing; a pull request
# runs when it is opened ready, marked ready for review or pushed while ready; main runs after a merge, a
# tag v* for the release; any branch on demand (Actions, CI, Run workflow, or gh workflow run ci.yml --ref
# <branch>). A newer push cancels the run of the same pull request or branch, and a head commit with
# [skip ci] in its message runs nothing. A run on demand with windows=false (gh workflow run ci.yml --ref
# <branch> -f windows=false) stops after the Linux job, which checks the whole workspace for Windows.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      windows:
        description: "Run the Windows job (tests, the build, the archive) after the Linux checks"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The commit the build names (--version, About, the logs): the head of a pull request, not the merge
  # commit GitHub tests.
  WINWEAVER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    name: Format, clippy, tests (Linux)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        id: fmt
        run: cargo fmt --all --check
        continue-on-error: true
      - name: Format patch
        if: steps.fmt.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff > fmt.patch
          git checkout -- .
      - name: Clippy (the whole workspace, checked for Windows)
        # The Windows crates compile for the Windows target without linking, so the Linux runner checks
        # every crate and every test; no dependency builds C code for that target.
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Tests (core)
        run: cargo test -p winweaver-core
      - name: CI files (Cargo.lock, the format patch)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-files
          path: |
            Cargo.lock
            fmt.patch
          if-no-files-found: ignore
      - name: Format result
        # An unformatted push stops here, before the Windows job spends its minutes.
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::cargo fmt found differences; apply fmt.patch from the ci-files artifact"
          exit 1

  build-windows:
    name: Build and tests (Windows)
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
        env:
          WINWEAVER_SCREENSHOTS: ${{ github.workspace }}/target/screenshots
      - name: Screenshots of the window
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots
          if-no-files-found: ignore
      - name: Catalog check
        run: cargo run -p winweaver -- --check-catalog
      - name: Release build
        run: cargo build --release --workspace
      - name: Window smoke test
        # The runner has no driver of OpenGL 2.0: Automatic must fall back from OpenGL to DirectX 12,
        # which draws on the software rasterizer of Windows.
        shell: pwsh
        run: |
          $exe = 'target/release/winweaver.exe'
          "winweaver.exe: $((Get-Item $exe).Length) bytes"
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-window' -PassThru -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          if (-not $p.WaitForExit(60000)) { $p.Kill(); 'the window did not close within 60 s' }
          Get-Content smoke.txt, smoke-err.txt -ErrorAction SilentlyContinue
          "exit code: $($p.ExitCode)"
          Get-ChildItem target/release/logs -ErrorAction SilentlyContinue | Get-Content -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          # The folder of the program: the artifact zips it once, so its download is the archive itself.
          $root = 'dist/WinWeaver'
          New-Item -ItemType Directory -Force $root | Out-Null
          # The license is built into the executable (Menu, License), so the exe alone carries it.
          Copy-Item target/release/winweaver.exe "$root/"
          Copy-Item package/README.md "$root/README.md"
          Copy-Item -Recurse data/presets "$root/profiles"
          Copy-Item -Recurse package/lang "$root/lang"
          Copy-Item -Recurse agents "$root/agents"
          # The editor wedit, built on WW, as an archive of its own.
          $wedit = 'dist-wedit/wedit'
          New-Item -ItemType Directory -Force $wedit | Out-Null
          Copy-Item target/release/wedit.exe "$wedit/"
          Copy-Item package-wedit/README.md "$wedit/README.md"
          Copy-Item -Recurse package-wedit/lang "$wedit/lang"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: WinWeaver-${{ env.VERSION }}
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wedit-${{ env.VERSION }}
          path: dist-wedit/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: WinWeaver-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wedit-*
          merge-multiple: true
          path: dist-wedit
      - name: Archive
        run: |
          v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          (cd dist && zip -qr "WinWeaver-$v.zip" WinWeaver)
          (cd dist-wedit && zip -qr "../dist/wedit-$v.zip" wedit)
      - name: Release notes file
        id: notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
