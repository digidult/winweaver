name: CI

# CI builds only a release (AGENTS.md, section 5): a tag v* (pushed on the explicit word of the customer)
# runs everything and publishes the release; any branch runs on demand (Actions, CI, Run workflow, or gh
# workflow run ci.yml --ref <branch>), for the tests that change Windows and the screenshots. Pushes and
# pull requests run nothing: the format, clippy and the safe tests run on the computer of the developer
# before every commit. A run on demand with windows=false stops after the Linux job, web=false leaves
# out the browser edition.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows:
        description: "Run the Windows job (tests, the build, the archive) after the Linux checks"
        type: boolean
        default: true
      web:
        description: "Build wwlite for the browser (wasm32, the archive wwlite-web) after the Linux checks"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The commit the build names (--version, About, the logs).
  WINWEAVER_COMMIT: ${{ github.sha }}

jobs:
  check:
    name: Format, clippy, tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        id: fmt
        run: cargo fmt --all --check
        continue-on-error: true
      - name: Format patch
        if: steps.fmt.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff > fmt.patch
          git checkout -- .
      - name: Clippy (the whole workspace, checked for Windows)
        # The Windows crates compile for the Windows target without linking, so the Linux runner checks
        # every crate and every test; no dependency builds C code for that target.
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Clippy (wwlite alone, without the feature full)
        # Built alone, so cargo does not give winweaver-ui the feature full of WinWeaver: the code
        # of the light edition is checked as it is built.
        run: cargo clippy -p wwlite --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Clippy (wwlite for the browser)
        # The browser edition: the target wasm32-unknown-unknown with the renderer glow alone (the wgpu
        # of WW is DirectX 12 only), the executable alone (its tests draw with the wgpu of egui_kittest).
        run: cargo clippy -p wwlite --no-default-features --features glow --target wasm32-unknown-unknown -- -D warnings
      - name: Tests (core)
        run: cargo test -p winweaver-core
      - name: CI files (Cargo.lock, the format patch)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-files
          path: |
            Cargo.lock
            fmt.patch
          if-no-files-found: ignore
      - name: Format result
        # An unformatted push stops here, before the Windows job spends its minutes.
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::cargo fmt found differences; apply fmt.patch from the ci-files artifact"
          exit 1

  build-windows:
    name: Build and tests (Windows)
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
        env:
          WINWEAVER_SCREENSHOTS: ${{ github.workspace }}/target/screenshots
      - name: Tests that change Windows (a test key of HKCU, the hive of the default user, an account, DISM, apps)
        # Ignored by a plain cargo test, so the computer of a developer never runs them; the runner is
        # an administrator. By hand in a VM: cargo test -p winweaver-win -- --ignored
        run: cargo test -p winweaver-win -- --ignored
      - name: Tests of wwlite (alone, without the feature full)
        run: cargo test -p wwlite
        env:
          WINWEAVER_SCREENSHOTS: ${{ github.workspace }}/target/screenshots
      - name: Screenshots of the window
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots
          if-no-files-found: ignore
      - name: Catalog check
        run: cargo run -p winweaver -- --check-catalog
      - name: Release build
        run: cargo build --release --workspace
      - name: Release build of wwlite (alone, without the feature full)
        # After the workspace, so target/release/wwlite.exe is the light one.
        run: cargo build --release -p wwlite
      - name: Window smoke test
        # The runner has no driver of OpenGL 2.0: Automatic must fall back from OpenGL to DirectX 12,
        # which draws on the software rasterizer of Windows.
        shell: pwsh
        run: |
          $exe = 'target/release/winweaver.exe'
          "winweaver.exe: $((Get-Item $exe).Length) bytes"
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-window' -PassThru -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          if (-not $p.WaitForExit(60000)) { $p.Kill(); 'the window did not close within 60 s' }
          Get-Content smoke.txt, smoke-err.txt -ErrorAction SilentlyContinue
          "exit code: $($p.ExitCode)"
          Get-ChildItem target/release/logs -ErrorAction SilentlyContinue | Get-Content -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Command line smoke test
        # The commands that write files, on the presets and the templates of the runner's Windows, into
        # a folder of the runner: each must end with the code 0 and write the files it names; a wrong use
        # ends with 2. The import and the read of this PC only read the system (the read takes DISM about
        # a minute as administrator) and write next to the executable of target/release.
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'target/release/winweaver.exe').Path
          $out = Join-Path $env:RUNNER_TEMP 'cli'
          New-Item -ItemType Directory -Force $out | Out-Null
          function Invoke-Cli([string[]]$a, [int]$want = 0) {
            "> winweaver $($a -join ' ')"
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -RedirectStandardOutput "$out/stdout.txt" -RedirectStandardError "$out/stderr.txt"
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'the command did not end within 300 s' }
            Get-Content "$out/stdout.txt", "$out/stderr.txt"
            if ($p.ExitCode -ne $want) { throw "the exit code was $($p.ExitCode), not $want" }
          }
          function Assert-File([string]$path) {
            if (-not (Test-Path -PathType Leaf $path)) { throw "missing $path" }
          }
          Invoke-Cli @('--build', 'Office', '--out', "$out/office.xml")
          Assert-File "$out/office.xml"
          Assert-File "$out/Setup-System.ps1"
          Invoke-Cli @('--build', 'strict', '--out', "$out/strict")
          Assert-File "$out/strict/autounattend.xml"
          Invoke-Cli @('--diff', 'Office', 'Strict', '--out', $out)
          Assert-File "$out/Office-vs-Strict.wwdiff"
          Invoke-Cli @('--reg', 'apply', "$out/Office-vs-Strict.wwdiff", '--out', "$out/diff.reg")
          Assert-File "$out/diff.reg"
          Invoke-Cli @('--script', 'audit', 'data/presets/office.wwprofile', '--out', "$out/audit.ps1")
          Assert-File "$out/audit.ps1"
          Invoke-Cli @('--script', 'apply', 'data/presets/office.wwprofile', '--out', "$out/apply.ps1")
          Assert-File "$out/apply.ps1"
          Assert-File "$out/Undo-Apply.ps1"
          $admx = 'C:\Windows\PolicyDefinitions\WindowsUpdate.admx'
          Invoke-Cli @('--export-catalog', $admx, '--out', "$out/update.wwcatalog")
          Assert-File "$out/update.wwcatalog"
          Invoke-Cli @('--export-catalog', 'system', '--out', "$out/system.wwcatalog")
          Assert-File "$out/system.wwcatalog"
          Invoke-Cli @('--import-admx', "$out/update.wwcatalog")
          $settings = 'target/release/winweaver.settings.json'
          Assert-File $settings
          if (-not ((Get-Content -Raw $settings) -match '"file-')) { throw 'the import is not in the settings' }
          Invoke-Cli @('--read-pc', '--out', "$out/pc.wwprofile")
          Assert-File "$out/pc.wwprofile"
          Invoke-Cli @('--build') 2
          Invoke-Cli @('--diff', 'Office', '--out', $out) 2
          Get-ChildItem -Recurse $out | Select-Object Length, FullName | Format-Table -AutoSize
      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          # The folder of the program: the artifact zips it once, so its download is the archive itself.
          $root = 'dist/WinWeaver'
          New-Item -ItemType Directory -Force $root | Out-Null
          # The license is built into the executable (Menu, License), so the exe alone carries it.
          Copy-Item target/release/winweaver.exe "$root/"
          Copy-Item package/README.md "$root/README.md"
          Copy-Item -Recurse data/presets "$root/profiles"
          Copy-Item -Recurse package/lang "$root/lang"
          Copy-Item -Recurse agents "$root/agents"
          # The editor wedit, built on WW, as an archive of its own.
          $wedit = 'dist-wedit/wedit'
          New-Item -ItemType Directory -Force $wedit | Out-Null
          Copy-Item target/release/wedit.exe "$wedit/"
          Copy-Item package-wedit/README.md "$wedit/README.md"
          Copy-Item -Recurse package-wedit/lang "$wedit/lang"
          # The light edition wwlite: the profile editor and the build of the answer file.
          $lite = 'dist-wwlite/wwlite'
          New-Item -ItemType Directory -Force "$lite/lang/de" | Out-Null
          Copy-Item target/release/wwlite.exe "$lite/"
          Copy-Item package-wwlite/README.md "$lite/README.md"
          Copy-Item -Recurse data/presets "$lite/profiles"
          Copy-Item data/lang/de/ui.json "$lite/lang/de/ui.json"
          Copy-Item package-wwlite/lang/de/guide-lite.txt "$lite/lang/de/guide-lite.txt"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Presentation
        # The slides for a prospective user, made of the screenshots of this build
        # (docs/presentation/README.md).
        shell: pwsh
        run: |
          python -m pip install --quiet python-pptx pillow
          python docs/presentation/make_presentation.py target/screenshots dist-presentation/WinWeaver.pptx $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-${{ env.VERSION }}
          path: dist-presentation/
      - uses: actions/upload-artifact@v4
        with:
          name: WinWeaver-${{ env.VERSION }}
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wedit-${{ env.VERSION }}
          path: dist-wedit/
      - uses: actions/upload-artifact@v4
        with:
          name: wwlite-${{ env.VERSION }}
          path: dist-wwlite/

  build-web:
    name: Build wwlite for the browser
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Release build (wasm32)
        run: cargo build --release -p wwlite --no-default-features --features glow --target wasm32-unknown-unknown
      - name: Page of the browser edition
        # wasm-bindgen of the version Cargo.lock names (its crate and its tool must match), the prebuilt
        # binary of its release: it writes the module and the JavaScript glue next to index.html in
        # files/, and single.py makes of them wwlite.html, the whole edition in one file.
        run: |
          v="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)"
          tool="wasm-bindgen-$v-x86_64-unknown-linux-musl"
          curl -sSL -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/$tool.tar.gz"
          tar xzf wasm-bindgen.tar.gz
          out="dist-web/wwlite-web"
          "./$tool/wasm-bindgen" --target web --no-typescript --out-dir "$out/files" target/wasm32-unknown-unknown/release/wwlite.wasm
          cp crates/wwlite/web/index.html "$out/files/index.html"
          # The edition by default: one HTML file with the glue and the packed module inside.
          python3 crates/wwlite/web/single.py "$out/files" "$out/wwlite.html"
          cp package-wwlite/README.md "$out/README.md"
          ls -l "$out" "$out/files"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: wwlite-web-${{ env.VERSION }}
          path: dist-web/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build-windows, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: WinWeaver-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wedit-*
          merge-multiple: true
          path: dist-wedit
      - uses: actions/download-artifact@v4
        with:
          pattern: wwlite-[0-9]*
          merge-multiple: true
          path: dist-wwlite
      - uses: actions/download-artifact@v4
        with:
          pattern: wwlite-web-*
          merge-multiple: true
          path: dist-web
      - name: Archive
        run: |
          v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          (cd dist && zip -qr "WinWeaver-$v.zip" WinWeaver)
          (cd dist-wedit && zip -qr "../dist/wedit-$v.zip" wedit)
          (cd dist-wwlite && zip -qr "../dist/wwlite-$v.zip" wwlite)
          (cd dist-web && zip -qr "../dist/wwlite-web-$v.zip" wwlite-web)
      - name: Release notes file
        id: notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
