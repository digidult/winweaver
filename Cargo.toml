[workspace]
resolver = "3"
members = [
    "crates/winweaver-core",
    "crates/winweaver-win",
    "crates/winweaver-mcp",
    "crates/winweaver-ui",
    "crates/winweaver",
    "crates/wwlite",
    "crates/winweaverweb",
]

[workspace.package]
version = "0.1.57"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/digidult/winweaver"
authors = ["digidult"]

[workspace.dependencies]
# W#, the framework of the window (supakov/ww, private): a git dependency of its branch main, which
# `cargo update -p ww -p ww-base` follows; cargo fetches it with git (.cargo/config.toml).
ww-base = { git = "https://github.com/supakov/ww", branch = "main" }
ww = { git = "https://github.com/supakov/ww", branch = "main", default-features = false }
# The MCP server of W# (the tools, their configuration, the transports, the tab of the window).
wwmcp = { git = "https://github.com/supakov/ww", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
