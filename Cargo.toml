[workspace]
resolver = "3"
members = [
    "crates/winweaver-core",
    "crates/winweaver-win",
    "crates/winweaver-mcp",
    "crates/winweaver-ui",
    "crates/winweaver",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/digidult/winweaver"
authors = ["digidult"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
