[package]
name = "wv-image"
description = "The plugin of wview for images: every format the Windows Imaging Component of this Windows decodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The DLL of the plugin, and the library the tests of wview take it from without a DLL.
crate-type = ["cdylib", "rlib"]

[features]
# The plugin as a library without the exports of a DLL, for the tests of a program
# (`wwrt::plugin!`).
library = []

[dependencies]
wwrt = { path = "../../crates/wwrt" }
