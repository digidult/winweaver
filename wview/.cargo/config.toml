# Every crate of wview links std dynamically (std-<hash>.dll of the toolchain): wwrt.dll, the
# program and its plugins share one std, since a crate may be in the process once (docs/plugins.md).
# The rustflags of a target replace [build] ones, and the ones of a parent config are joined before
# these. For msvc every module takes the CRT statically, as WinWeaver does: the std-<hash>.dll of
# msvc imports no DLL of the CRT, and with the dynamic one wview.exe, wwrt.dll and every plugin
# imported VCRUNTIME140.dll, which a clean Windows may lack. The tree of a release has no parent
# config, so the flag is written here.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "prefer-dynamic", "-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "prefer-dynamic"]
